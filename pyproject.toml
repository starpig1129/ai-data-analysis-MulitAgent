# Tool configuration only. The application is installed from requirements.txt.

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Line length is owned by `ruff format`; what remains are long strings and comments.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["main.py", "src", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
